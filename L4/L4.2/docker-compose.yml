version: "3.9"

services:
  grep1:
    build: .
    container_name: grep1
    command: go run cmd/server/main.go
    ports:
      - "8081:8080"
    volumes:
      - .:/app
    working_dir: /app

  grep2:
    build: .
    container_name: grep2
    command: go run cmd/server/main.go
    ports:
      - "8082:8080"
    volumes:
      - .:/app
    working_dir: /app

  grep3:
    build: .
    container_name: grep3
    command: go run cmd/server/main.go
    ports:
      - "8083:8080"
    volumes:
      - .:/app
    working_dir: /app